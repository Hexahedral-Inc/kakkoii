<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kakkoii camera</title>
<link rel="stylesheet" href="theme.css" />
<style>
  .bubble { position: absolute; inset: 10px; border-radius: 26px; overflow: hidden; cursor: grab; background: #000;
    box-shadow: 0 0 0 1px var(--line-strong), 0 14px 36px rgba(0,0,0,.45);
    animation: pop .62s cubic-bezier(.2, 1.3, .35, 1) both; transition: border-radius .35s var(--spring); }
  @keyframes pop { from { opacity: 0; transform: scale(.4) } }
  .bubble.round { border-radius: 50%; }
  .full .bubble { inset: 0; border-radius: 0; box-shadow: none; animation: none; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-2); font-size: 12px; text-align: center; padding: 18px; }
</style>
</head>
<body>
<div class="bubble" id="b" data-tauri-drag-region>
  <video id="v" autoplay muted playsinline></video>
</div>
<script>
  const b = document.getElementById('b');
  // ?full: the face-only recording, the whole window is the picture.
  if (location.search.includes('full')) document.body.classList.add('full');
  // Double-click: box or circle. Scroll: bigger or smaller. Drag: anywhere.
  b.addEventListener('dblclick', () => b.classList.toggle('round'));
  if (window.__TAURI__ && !location.search.includes('full')) {
    const { getCurrentWindow, LogicalSize } = window.__TAURI__.window;
    const win = getCurrentWindow();
    let size = 200;
    window.addEventListener('wheel', (e) => {
      size = Math.max(120, Math.min(480, size + (e.deltaY < 0 ? 24 : -24)));
      void win.setSize(new LogicalSize(size, size));
    }, { passive: true });
  }
  navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' }, audio: false })
    .then((s) => { document.getElementById('v').srcObject = s; })
    .catch((e) => { b.innerHTML = `<div class="msg">No camera found<br>${e.name}</div>`; });
</script>
</body>
</html>
