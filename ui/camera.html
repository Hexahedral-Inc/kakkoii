<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kakkoii camera</title>
<link rel="stylesheet" href="theme.css" />
<style>
  .bubble { position: absolute; inset: 10px; border-radius: 26px; overflow: hidden; cursor: grab; background: #000;
    box-shadow: 0 0 0 1px var(--line-strong), 0 14px 36px rgba(0,0,0,.45);
    animation: pop .62s cubic-bezier(.2, 1.3, .35, 1) both; transition: border-radius .35s var(--spring); }
  @keyframes pop { from { opacity: 0; transform: scale(.4) } }
  .bubble.round { border-radius: 50%; }
  .full .bubble { inset: 0; border-radius: 0; box-shadow: none; animation: none; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-2); font-size: 12px; text-align: center; padding: 18px; line-height: 1.45; }
  /* Hover: which camera this is, and a way out. */
  .x { position: absolute; top: 16px; right: 16px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: rgba(0,0,0,.62); color: #fff; opacity: .75; transition: opacity .15s, transform .25s var(--spring); z-index: 2; }
  .x:hover { opacity: 1; transform: scale(1.1); }
  .round ~ .x { top: 22px; right: 22px; }
  .tag { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100% - 40px); padding: 4px 9px; border-radius: 999px;
    background: rgba(0,0,0,.6); color: #fff; font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 2; }
  body:hover .tag, .tag.show { opacity: 1; }
  .full .x, .full .tag { display: none; }
</style>
</head>
<body>
<div class="bubble" id="b">
  <video id="v" autoplay muted playsinline></video>
</div>
<div class="x" id="x" title="Close the face bubble"></div>
<div class="tag" id="tag"></div>
<script type="module">
  import { icon } from './icons.js';
  const $ = (id) => document.getElementById(id);
  const b = $('b');
  $('x').innerHTML = icon('x', 13);
  // ?full: the face-only recording, the whole window is the picture.
  if (location.search.includes('full')) document.body.classList.add('full');
  // Double-click: box or circle. Scroll: bigger or smaller. Right-click: next camera. Drag: anywhere.
  b.addEventListener('dblclick', () => b.classList.toggle('round'));
  if (window.__TAURI__) {
    $('x').onclick = () => void window.__TAURI__.core.invoke('set_camera', { on: false });
    if (!location.search.includes('full')) {
      const { getCurrentWindow, LogicalSize } = window.__TAURI__.window;
      const win = getCurrentWindow();
      // Drag it by any part but the ×, whatever is showing (video or a message).
      addEventListener('mousedown', (e) => { if (e.button === 0 && e.detail < 2 && !e.target.closest('.x')) void win.startDragging(); });
      let size = 200;
      window.addEventListener('wheel', (e) => {
        size = Math.max(120, Math.min(480, size + (e.deltaY < 0 ? 24 : -24)));
        void win.setSize(new LogicalSize(size, size));
      }, { passive: true });
    }
  }

  // Laptops often have two cameras: the real one and an IR one for Windows Hello,
  // which gives a black or grey picture. Never pick the IR one on our own.
  const IR = /\bIR\b|infrared|hello/i;
  let cams = [], stream = null;
  const say = (html) => { $('v').hidden = true; b.querySelector('.msg')?.remove(); b.insertAdjacentHTML('beforeend', `<div class="msg">${html}</div>`); };
  function tag(text) {
    $('tag').textContent = text; $('tag').classList.add('show');
    clearTimeout(tag.t); tag.t = setTimeout(() => $('tag').classList.remove('show'), 2200);
  }
  async function open(id) {
    stream?.getTracks().forEach((t) => t.stop());
    const video = { width: 1280, height: 720, ...(id ? { deviceId: { exact: id } } : { facingMode: 'user' }) };
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
    const v = $('v'); v.hidden = false; b.querySelector('.msg')?.remove();
    v.srcObject = stream;
    const label = stream.getVideoTracks()[0]?.label || 'Camera';
    localStorage.setItem('camera', stream.getVideoTracks()[0]?.getSettings().deviceId || '');
    tag(label.replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)$/i, ''));
  }
  async function start() {
    try {
      await open(localStorage.getItem('camera') || null);
    } catch (e) {
      try { await open(null); } catch (e2) {
        say(e2.name === 'NotAllowedError'
          ? 'Camera blocked<br>Settings › Privacy › Camera'
          : e2.name === 'NotReadableError' ? 'Another app is using the camera' : `No camera found<br>${e2.name}`);
        return;
      }
    }
    // Labels only show once we have the camera, so pick again now if we landed on IR.
    cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
    const cur = stream.getVideoTracks()[0];
    if (IR.test(cur?.label || '')) {
      const real = cams.find((c) => !IR.test(c.label));
      if (real) await open(real.deviceId).catch(() => {});
    }
    log(`cameras: ${cams.map((c) => c.label || '?').join(' | ')}`);
    void watch();
  }

  // HP and other laptops have a camera key: with it off, the camera still opens but
  // sends a fixed "camera off" picture. A real sensor always has some noise, so a
  // dark picture that doesn't change at all is that picture. Say so, and keep
  // looking, so it comes back by itself when the key is pressed.
  const log = (msg) => void window.__TAURI__?.core.invoke('ui_log', { msg }).catch(() => {});
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 36;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  const grab = () => { cx.drawImage($('v'), 0, 0, 64, 36); return cx.getImageData(0, 0, 64, 36).data; };
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let dead = false;
  async function watch() {
    for (;;) {
      await wait(dead ? 1500 : 1200);
      const v = $('v');
      if (!stream || v.readyState < 2) continue;
      const a = grab(); await wait(600); const c = grab();
      let mean = 0, diff = 0;
      for (let i = 0; i < a.length; i += 4) { mean += (c[i] + c[i + 1] + c[i + 2]) / 3; diff += Math.abs(a[i] - c[i]) + Math.abs(a[i + 1] - c[i + 1]); }
      mean /= a.length / 4; diff /= a.length / 2;
      const off = mean < 24 && diff < 0.05;
      if (off !== dead) {
        dead = off;
        const t = stream.getVideoTracks()[0], st = t?.getSettings() || {};
        log(`${t?.label}: ${st.width}x${st.height} mean=${mean.toFixed(1)} diff=${diff.toFixed(2)} ${off ? 'CAMERA OFF PICTURE' : 'live'}`);
        if (off) {
          say('Your camera is switched off<br><br>Press the camera key on your keyboard<br>(the one with a crossed-out camera)');
          v.hidden = false; v.style.opacity = '0';
        } else { b.querySelector('.msg')?.remove(); v.style.opacity = '1'; }
      }
    }
  }
  addEventListener('contextmenu', async (e) => {
    e.preventDefault();
    if (cams.length < 2) { tag('Only one camera'); return; }
    const cur = stream?.getVideoTracks()[0]?.getSettings().deviceId;
    const next = cams[(cams.findIndex((c) => c.deviceId === cur) + 1) % cams.length];
    await open(next.deviceId).catch((err) => tag(`${next.label}: ${err.name}`));
  });
  // Let go of the camera before the window goes, or the light stays on.
  window.stopCamera = () => { stream?.getTracks().forEach((t) => t.stop()); stream = null; $('v').srcObject = null; };
  addEventListener('pagehide', window.stopCamera);
  void start();
</script>
</body>
</html>
