<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kakkoii area</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { cursor: crosshair; }
  /* The whole screen dims, except the box. */
  .shade { position: fixed; inset: 0; background: rgba(0,0,0,.42); animation: in .18s ease-out; }
  .shade.has { background: transparent; }
  @keyframes in { from { opacity: 0 } }
  .box { position: fixed; display: none; border: 1.5px solid #fff; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,.42); }
  .box.on { display: block; }
  .size { position: absolute; left: 0; top: -30px; font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: #000; color: #fff;
    border: 1px solid var(--line); white-space: nowrap; }
  .hint { position: fixed; top: 22px; left: 50%; transform: translateX(-50%); height: 40px; padding: 0 16px; border-radius: 20px; background: #000;
    border: 1px solid var(--line); display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); cursor: default;
    animation: drop .5s cubic-bezier(.2, 1.3, .35, 1) both; }
  @keyframes drop { from { opacity: 0; transform: translate(-50%, -14px) scale(.6) } }
  .hint b { color: #fff; font-weight: 600; }
  .hint .k { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
  .go { position: absolute; right: 0; bottom: -46px; display: flex; gap: 6px; }
  .go button { height: 34px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line-strong); background: #000; color: #fff;
    font-size: 12.5px; font-weight: 650; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: transform .3s var(--spring); }
  .go button:active { transform: scale(.94); }
  .go .rec i { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); }
</style>
</head>
<body>
<div class="shade" id="shade"></div>
<div class="hint"><b>Drag a box</b> to record that part of the screen <span class="k mono">enter</span> record <span class="k mono">esc</span> cancel</div>
<div class="box" id="box">
  <span class="size mono" id="size"></span>
  <div class="go" id="go" hidden><button id="redo">Redo</button><button class="rec" id="rec"><i></i>Record this</button></div>
</div>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  let a = null, r = null, dragging = false;
  const dpr = () => window.devicePixelRatio || 1;

  function draw() {
    if (!r) return;
    Object.assign($('box').style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    $('box').classList.add('on');
    $('shade').classList.add('has');
    $('size').textContent = `${Math.round(r.w * dpr()) & ~1} × ${Math.round(r.h * dpr()) & ~1}`;
  }
  addEventListener('mousedown', (e) => {
    if (e.target.closest('.go') || e.target.closest('.hint')) return;
    a = { x: e.clientX, y: e.clientY }; dragging = true; $('go').hidden = true;
  });
  addEventListener('mousemove', (e) => {
    if (!dragging) return;
    r = { x: Math.min(a.x, e.clientX), y: Math.min(a.y, e.clientY), w: Math.abs(e.clientX - a.x), h: Math.abs(e.clientY - a.y) };
    draw();
  });
  addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    if (r && r.w > 16 && r.h > 16) $('go').hidden = false;
  });
  const go = () => {
    if (!r || r.w < 16 || r.h < 16) return;
    const d = dpr();
    void invoke('area_chosen', { rect: [Math.round(r.x * d), Math.round(r.y * d), Math.round(r.w * d), Math.round(r.h * d)] });
  };
  const cancel = () => void invoke('area_chosen', { rect: null });
  $('rec').onclick = go;
  $('redo').onclick = () => { r = null; $('box').classList.remove('on'); $('shade').classList.remove('has'); $('go').hidden = true; };
  addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); if (e.key === 'Escape') cancel(); });
</script>
</body>
</html>
