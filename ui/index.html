<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kakkoii</title>
<style>
  :root {
    --ink: #f5f5f7;
    --muted: rgba(245, 245, 247, 0.55);
    --line: rgba(255, 255, 255, 0.08);
    --rec: #ff3b30;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; color: var(--ink); overflow: hidden;
    font: 500 13px/1.3 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }

  .shell { height: 100%; display: grid; grid-template-rows: 36px 1fr 44px;
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)); }

  .bar { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 14px; }
  .brand { font-weight: 700; letter-spacing: 0.02em; }
  .brand i { font-style: normal; color: var(--rec); }
  .x { width: 26px; height: 26px; border: 0; border-radius: 8px; background: transparent; color: var(--muted);
    font-size: 15px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .x:hover { background: rgba(255,255,255,0.08); color: var(--ink); }

  .stage { display: flex; align-items: center; justify-content: center; gap: 22px; }

  .rec { position: relative; width: 76px; height: 76px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,0.08); box-shadow: inset 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.35);
    transition: transform 0.35s var(--spring); }
  .rec:hover { transform: scale(1.04); }
  .rec:active { transform: scale(0.92); transition-duration: 0.08s; }
  .rec .dot { position: absolute; inset: 18px; border-radius: 50%; background: var(--rec);
    box-shadow: 0 0 0 0 rgba(255,59,48,0.5), inset 0 2px 0 rgba(255,255,255,0.25);
    transition: inset 0.4s var(--spring), border-radius 0.4s var(--spring); }
  .rec .ring { position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--rec); opacity: 0; }
  .on .rec .dot { inset: 26px; border-radius: 6px; }
  .on .rec .ring { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(1.35); opacity: 0; } }

  .readout { min-width: 110px; }
  .time { font: 600 30px/1 "Cascadia Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .label { margin-top: 6px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: background 0.2s; }
  .on .live { background: var(--rec); }

  .foot { display: flex; align-items: center; padding: 0 14px; border-top: 1px solid var(--line); color: var(--muted); }
  .saved { display: flex; align-items: center; gap: 8px; opacity: 0; transform: translateY(8px);
    transition: opacity 0.25s, transform 0.45s var(--spring); }
  .saved.show { opacity: 1; transform: none; }
  .saved b { color: var(--ink); font-weight: 600; }
  .open { margin-left: auto; border: 0; border-radius: 7px; padding: 5px 10px; cursor: pointer;
    background: rgba(255,255,255,0.1); color: var(--ink); font: inherit; transition: transform 0.3s var(--spring); }
  .open:active { transform: scale(0.94); }
  .err { color: #ff8a80; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="bar" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region>kakkoii<i>.</i></span>
    <button class="x" id="close" aria-label="Close">×</button>
  </div>

  <div class="stage">
    <button class="rec" id="rec" aria-label="Record"><span class="ring"></span><span class="dot"></span></button>
    <div class="readout">
      <div class="time" id="time">00:00</div>
      <div class="label"><span class="live"></span><span id="mode">Full screen</span></div>
    </div>
  </div>

  <div class="foot" id="foot">
    <div class="saved" id="saved"><span>Saved</span><b id="file"></b></div>
  </div>
</div>

<script>
  const { invoke } = window.__TAURI__.core;
  const win = window.__TAURI__.window.getCurrentWindow();
  const $ = (id) => document.getElementById(id);
  let recording = false, started = 0, tick = 0, busy = false;

  const fmt = (s) => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

  $("close").onclick = () => win.close();

  $("rec").onclick = async () => {
    if (busy) return;
    busy = true;
    try {
      if (!recording) {
        await invoke("start_recording");
        recording = true; started = Date.now();
        $("shell").classList.add("on"); $("saved").classList.remove("show");
        $("time").textContent = "00:00";
        tick = setInterval(() => { $("time").textContent = fmt(Math.floor((Date.now() - started) / 1000)); }, 1000);
      } else {
        clearInterval(tick);
        $("shell").classList.remove("on");
        recording = false;
        const path = await invoke("stop_recording");
        showSaved(path);
      }
    } catch (e) {
      $("foot").innerHTML = `<span class="err">${String(e)}</span>`;
    } finally { busy = false; }
  };

  function showSaved(path) {
    $("foot").innerHTML = `<div class="saved" id="saved"><span>Saved</span><b>${path.split(/[\\/]/).pop()}</b></div><button class="open" id="open">Show</button>`;
    $("open").onclick = () => invoke("reveal", { path });
    requestAnimationFrame(() => $("saved").classList.add("show"));
  }
</script>
</body>
</html>
