<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kakkoii</title>
<link rel="stylesheet" href="theme.css" />
<style>
  .wrap { width: 100%; height: 100%; display: flex; align-items: flex-end; }
  .body { width: 100%; overflow: hidden; animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity: 0 } }

  /* A grid, not a list: four ways to record, then the open windows as pictures, then settings. */
  .list { padding: 6px 12px 10px; }
  .sec { display: flex; align-items: baseline; gap: 8px; margin: 10px 4px 7px; font-size: 10.5px; font-weight: 650; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .sec span { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .it { cursor: pointer; border: 1px solid transparent; border-radius: 14px; transition: border-color .12s, background .12s, transform .25s var(--spring); }
  .it:active { transform: scale(.97); }
  .it.sel { border-color: var(--line-strong); background: rgba(255,255,255,.05); }
  .modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mode { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 11px; color: var(--text-2); }
  .mode .lens { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff;
    background: radial-gradient(circle at 50% 30%, #2a2a2e 0%, #0b0b0d 65%, #000 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 4px 12px rgba(0,0,0,.5); }
  .mode.red .lens { color: var(--rec); }
  .mode.sel { color: var(--text); }
  .mode.sel .lens { box-shadow: inset 0 0 0 1px rgba(255,255,255,.7), 0 4px 12px rgba(0,0,0,.5); }
  .mode .t { font-size: 12.5px; font-weight: 550; text-align: center; }
  .mode .k { font-size: 10px; color: var(--muted); }
  .wins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .win { padding: 5px; min-width: 0; }
  .win .pic { aspect-ratio: 16 / 10; border-radius: 9px; overflow: hidden; background: #0d0d0f; display: grid; place-items: center; color: var(--muted);
    box-shadow: inset 0 0 0 1px var(--line); }
  .win .pic img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; animation: fadeIn .25s ease-out; }
  .win .cap { display: flex; align-items: center; gap: 6px; padding: 7px 3px 2px; min-width: 0; }
  .win .t { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .win.sel .t { color: var(--text); }
  .win .p { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .none { padding: 14px 4px; font-size: 12px; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .opt { display: flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 99px; font-size: 12px; color: var(--text-2); border-color: var(--line); }
  .opt.on { color: var(--text); }
  .opt.on .ic, .opt.on svg { color: var(--green); }

  .saved { margin: 10px 10px 2px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); display: flex; align-items: center; gap: 11px;
    animation: chipIn .28s ease-out both; }
  .saved .ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(34,197,94,.16); color: var(--green); flex: none; }
  .saved .what { flex: 1; min-width: 0; }
  .saved .name { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .saved .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .chip { font-size: 11.5px; font-weight: 650; color: #fff; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line-strong);
    background: transparent; cursor: pointer; white-space: nowrap; transition: background .15s, transform .3s var(--spring); }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip:active { transform: scale(.94); }
  .err { margin: 10px 10px 2px; padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(239,68,68,.45); color: #fca5a5; font-size: 12.5px; animation: chipIn .25s ease-out both; }

  .foot { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-top: 1px solid var(--line); }
  .mark { width: 18px; height: 18px; flex: none; border-radius: 5px; box-shadow: 0 0 0 1px var(--line); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rec); flex: none; box-shadow: 0 0 0 3px rgba(255,59,48,.18); }
  input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; user-select: text; }
  input::placeholder { color: var(--muted); }
  .sq { width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--text-2);
    display: grid; place-items: center; cursor: pointer; transition: transform .3s var(--spring), color .15s, background .15s; }
  .sq:active { transform: scale(.9); }
  .sq.on { color: #fff; background: rgba(255,59,48,.22); border-color: rgba(255,59,48,.45); }
  .esc { font-size: 10.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="body metal" id="body">
    <div id="top"></div>
    <div class="list" id="list"></div>
    <div class="foot">
      <img class="mark" src="logo.svg" alt="" />
      <input id="q" placeholder="Record something, or type a window name" spellcheck="false" autocomplete="off" />
      <button class="sq" id="cam" title="Face bubble"></button>
      <span class="esc mono">esc</span>
    </div>
  </div>
</div>

<script type="module">
  import { icon } from './icons.js';

  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const { getCurrentWindow, LogicalSize, LogicalPosition } = window.__TAURI__.window;
  const win = getCurrentWindow();
  const W = 700;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);


  const QUALITY = { balanced: 'Balanced · 60 fps', high: 'High · 60 fps', small: 'Small · 30 fps' };
  const ORDER = ['balanced', 'high', 'small'];
  const BROWSERS = /chrome|msedge|firefox|brave|opera|vivaldi|arc/i;
  let quality = localStorage.getItem('quality') || 'balanced';
  let sound = { system: localStorage.getItem('sound.system') !== 'off', mic: localStorage.getItem('sound.mic') !== 'off' };
  const toggleSound = (k) => { sound[k] = !sound[k]; localStorage.setItem('sound.' + k, sound[k] ? 'on' : 'off'); render(); };
  let state = { recording: false, camera: false };
  let windows = [], thumbs = {}, files = 0, sel = 0, shown = [], top = null;

  const hide = () => { $('q').value = ''; sel = 0; clearTimeout(picT); void win.hide(); };
  const record = async (opts) => {
    try { top = null; await invoke('start_recording', { opts: { quality, sound: { ...sound }, ...opts } }); $('q').value = ''; }
    catch (e) { top = { err: String(e) }; render(); }
  };

  function commands() {
    const proc = (p) => (p || '').replace(/\.exe$/i, '');
    const wins = windows.map((w) => ({
      id: 'w:' + w.title, icon: BROWSERS.test(w.process || '') ? 'browser' : 'window', text: `Record ${w.title}`, title: w.title, hint: proc(w.process), thumb: thumbs[w.title],
      search: `${w.title} ${w.process}`, run: () => record({ target: { kind: 'window', query: w.title } }),
    }));
    const base = [
      { id: 'screen', icon: 'record', red: true, short: 'Screen', text: 'Record the screen', hint: 'enter', run: () => record({ target: { kind: 'screen' } }) },
      { id: 'face', icon: 'face', short: 'Screen + face', text: 'Record the screen with my face', hint: 'face', run: () => record({ target: { kind: 'screen' }, camera: true, sound: { ...sound, mic: true } }) },
      { id: 'area', icon: 'area', short: 'Area', text: 'Record an area (drag a box)', hint: 'drag',
        run: () => void invoke('pick_area', { opts: { quality, sound: { ...sound } } }).catch((e) => { top = { err: String(e) }; render(); }) },
      { id: 'faceonly', icon: 'camera', short: 'Just my face', text: 'Record just my face', hint: 'camera', run: () => record({ target: { kind: 'face' }, sound: { ...sound, mic: true } }) },
    ];
    const tail = [
      { id: 'system', icon: sound.system ? 'speaker' : 'speakerOff', short: sound.system ? 'Sound on' : 'Sound off', text: sound.system ? 'Record the computer\'s sound' : 'Computer sound is off', hint: sound.system ? 'on' : 'off', on: sound.system, keep: true, run: () => toggleSound('system') },
      { id: 'mic', icon: sound.mic ? 'mic' : 'micOff', short: sound.mic ? 'Mic on' : 'Mic off', text: sound.mic ? 'Record my microphone' : 'Microphone is off', hint: sound.mic ? 'on' : 'off', on: sound.mic, keep: true, run: () => toggleSound('mic') },
      { id: 'quality', icon: 'quality', short: QUALITY[quality].split(' · ')[0], text: `Quality: ${QUALITY[quality]}`, hint: 'change', keep: true,
        run: () => { quality = ORDER[(ORDER.indexOf(quality) + 1) % ORDER.length]; localStorage.setItem('quality', quality); render(); } },
      { id: 'bubble', icon: state.camera ? 'cameraOff' : 'camera', short: 'Face bubble', text: state.camera ? 'Hide my face bubble' : 'Show my face bubble', hint: state.camera ? 'on' : 'off', on: state.camera, keep: true,
        run: () => void invoke('set_camera', { on: !state.camera }).catch((e) => { top = { err: String(e) }; render(); }) },
      { id: 'folder', icon: 'folder', short: 'Recordings', text: 'Open my recordings', hint: files ? `${files}` : '', run: () => void invoke('open_folder') },
      { id: 'agents', icon: 'agents', short: 'Copy MCP', text: 'Copy the MCP command for agents', hint: 'port 4777', keep: true,
        run: async () => { const c = await invoke('agent_command'); await navigator.clipboard.writeText(c); top = { note: 'Copied. Paste it in a terminal to give an agent the camera.' }; render(); } },
    ];
    return { base, wins, tail };
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const { base, wins, tail } = commands();
    const match = (c) => (c.search || c.text).toLowerCase().includes(q);
    const modes = q ? base.filter(match) : base;
    let ws = (q ? wins.filter(match) : wins).slice(0, 6);
    if (q && !ws.length) ws = [{ id: 'try', text: `First window matching "${$('q').value.trim()}"`, hint: 'enter', run: () => record({ target: { kind: 'window', query: $('q').value.trim() } }) }];
    const opts = q ? tail.filter(match) : tail;
    shown = [...modes, ...ws, ...opts];
    sel = Math.max(0, Math.min(sel, shown.length - 1));
    let i = 0;
    const mode = (c) => `<div class="it mode${c.red ? ' red' : ''}" data-i="${i++}"><span class="lens">${icon(c.icon, 17)}</span><span class="t">${esc(c.short)}</span><span class="k mono">${esc(c.hint)}</span></div>`;
    const win = (c) => `<div class="it win" data-i="${i++}" title="${esc(c.title || c.text)}"><div class="pic">${c.thumb ? `<img src="${c.thumb}" alt="" />` : icon(c.icon || 'window', 22)}</div><div class="cap"><span class="t">${esc(c.title || c.text)}</span>${c.hint ? `<span class="p mono">${esc(c.hint)}</span>` : ''}</div></div>`;
    const opt = (c) => `<div class="it opt${c.on ? ' on' : ''}" data-i="${i++}">${icon(c.icon, 12)}<span>${esc(c.short || c.text)}</span>${c.hint && c.id === 'folder' ? `<span class="mono">${esc(c.hint)}</span>` : ''}</div>`;
    $('list').innerHTML =
      (modes.length ? `<div class="sec">Record</div><div class="modes">${modes.map(mode).join('')}</div>` : '') +
      `<div class="sec">Windows <span>${q ? '' : 'type to find one'}</span></div>` +
      (ws.length ? `<div class="wins">${ws.map(win).join('')}</div>` : '<div class="none">No windows open</div>') +
      (opts.length ? `<div class="opts">${opts.map(opt).join('')}</div>` : '');
    $('list').querySelectorAll('.it').forEach((r) => {
      r.onmouseenter = () => { sel = +r.dataset.i; paintSel(); };
      r.onclick = () => run(shown[+r.dataset.i]);
    });
    paintSel();
    $('top').innerHTML = !top ? '' : top.err ? `<div class="err">${esc(top.err)}</div>`
      : top.note ? `<div class="saved"><span class="ok">${icon('check', 12)}</span><div class="what"><div class="name">${esc(top.note)}</div></div></div>`
      : `<div class="saved"><span class="ok">${icon('check', 12)}</span><div class="what"><div class="name">${esc(top.file.split(/[\\/]/).pop())}</div><div class="meta mono">${top.meta}</div></div>${/\.mp4$/i.test(top.file) ? '<button class="chip" id="trim">Trim</button>' : ''}<button class="chip" id="show">Show</button><button class="chip" id="copy">Copy path</button></div>`;
    if (top?.file) {
      if ($('trim')) $('trim').onclick = () => void invoke('open_trim', { file: top.file }).catch((e) => { top = { err: String(e) }; render(); });
      $('show').onclick = () => void invoke('reveal', { path: top.file });
      $('copy').onclick = async () => { await navigator.clipboard.writeText(top.file); $('copy').textContent = 'Copied'; };
    }
    $('cam').innerHTML = icon(state.camera ? 'camera' : 'cameraOff', 13);
    $('cam').classList.toggle('on', state.camera);
  }
  const paintSel = () => $('list').querySelectorAll('.it').forEach((r, i) => r.classList.toggle('sel', i === sel));
  // Up and down in a grid: the closest tile in the next row.
  function near(dir) {
    const els = [...$('list').querySelectorAll('.it')], r0 = els[sel]?.getBoundingClientRect();
    if (!r0) return 0;
    const cx = r0.left + r0.width / 2;
    let best = sel, bestD = Infinity;
    for (const [i, el] of els.entries()) {
      const r = el.getBoundingClientRect();
      const dy = (r.top - r0.top) * dir;
      if (dy < 4) continue;
      const d = dy * 4 + Math.abs(r.left + r.width / 2 - cx);
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }
  const run = (c) => { if (!c) return; c.run(); if (!c.keep) $('q').value = ''; };

  $('q').addEventListener('input', () => { sel = 0; render(); });
  $('q').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); hide(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = near(e.key === 'ArrowDown' ? 1 : -1); paintSel(); }
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !$('q').value) { e.preventDefault(); sel = Math.max(0, Math.min(shown.length - 1, sel + (e.key === 'ArrowRight' ? 1 : -1))); paintSel(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(shown[sel]); }
  });
  $('cam').onclick = () => void invoke('set_camera', { on: !state.camera });

  async function refresh() {
    try {
      windows = (await invoke('targets')).filter((t) => t.kind === 'window' && !/^(Windows Input Experience|Program Manager|Settings)$/.test(t.title));
      files = (await invoke('recordings')).files.length;
    } catch { /* keep what we had */ }
    render();
    void pictures();
  }
  // What each window shows, fetched after the list so the bar opens at once; again every few seconds while it's open.
  let picT = 0, picBusy = false;
  async function pictures() {
    clearTimeout(picT);
    if (picBusy || !(await win.isVisible())) return;
    picBusy = true;
    try { for (const t of await invoke('window_thumbs')) if (t.thumb) thumbs[t.title] = t.thumb; render(); }
    catch { /* no pictures this time */ }
    picBusy = false;
    picT = setTimeout(pictures, 4000);
  }

  const fmtLen = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
  const fmtSize = (b) => b > 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${(b / 1e6).toFixed(1)} MB`;
  listen('kakkoii://state', (e) => { state = e.payload; render(); });
  listen('kakkoii://saved', (e) => {
    const r = e.payload;
    top = { file: r.file, meta: r.kind === 'screenshot' ? `Screenshot · ${r.width}×${r.height} · ${fmtSize(r.bytes)}` : `${fmtLen(r.seconds)} · ${fmtSize(r.bytes)}` };
    void refresh();
  });
  // The orb changes the same settings; pick them up each time the bar opens.
  listen('kakkoii://open', () => {
    quality = localStorage.getItem('quality') || 'balanced';
    sound.system = localStorage.getItem('sound.system') !== 'off';
    sound.mic = localStorage.getItem('sound.mic') !== 'off';
    setTimeout(() => $('q').focus(), 30); void refresh();
  });

  // Like Sage's bar: it goes when you click away (Alt+Shift+R brings it back).
  let focusedOnce = false;
  win.onFocusChanged(({ payload }) => { if (payload) { focusedOnce = true; void refresh(); } else if (focusedOnce && !state.recording) hide(); });

  // The window grows upward with its content; the bottom edge stays where it is.
  new ResizeObserver(async () => {
    const el = $('body');
    const scale = await win.scaleFactor();
    const pos = (await win.outerPosition()).toLogical(scale);
    const size = (await win.outerSize()).toLogical(scale);
    const h = Math.ceil(el.offsetHeight);
    if (Math.abs(h - size.height) < 2) return;
    const bottom = pos.y + size.height;
    await win.setSize(new LogicalSize(W, h));
    await win.setPosition(new LogicalPosition(pos.x, bottom - h));
  }).observe($('body'));

  invoke('status').then((s) => { state = s; render(); });
  void refresh();
  setTimeout(() => $('q').focus(), 60);
</script>
</body>
</html>
