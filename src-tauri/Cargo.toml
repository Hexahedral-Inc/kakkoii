[package]
name = "kakkoii"
version = "0.0.1"
description = "A light, open-source screen recorder"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# The glass looks behind its window (Sage's glass_frame).
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2"
wasapi = "0.27"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# Kakkoii's copy of windows-capture (MIT): adds region crop and pause offsets to the encoder.
[patch.crates-io]
windows-capture = { path = "vendor/windows-capture" }
